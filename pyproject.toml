[project]
name = "quants"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10,<3.14"


dependencies = [
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
